name: Deploy website via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Upload site to FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare FTP upload folder
        run: |
          mkdir -p publish/neobellee
          rsync -av \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='README.md' \
            --exclude='publish' \
            ./ publish/neobellee/

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy to FTP server
        env:
          FTP_SERVER: wp1094792.server-he.de
          FTP_USERNAME: ftp1094792-smb
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'LFTP'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          mkdir -p /www/neobellee
          mirror --reverse --delete --verbose publish/neobellee /www/neobellee
          bye
          LFTP
